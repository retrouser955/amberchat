<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Crescent moon logo">
	<title>Crescent moon logo</title>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0.45" y2="1">
			<stop offset="0" stop-color="#121c44" />
			<stop offset="0.55" stop-color="#0a1230" />
			<stop offset="1" stop-color="#050818" />
		</linearGradient>
		<radialGradient id="ambient" cx="0.42" cy="0.42" r="0.6">
			<stop offset="0" stop-color="#ffe94a" stop-opacity="0.3" />
			<stop offset="0.55" stop-color="#ffd400" stop-opacity="0.1" />
			<stop offset="1" stop-color="#ffd400" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="moon" x1="0.15" y1="0" x2="0.85" y2="1">
			<stop offset="0" stop-color="#fffde0" />
			<stop offset="0.25" stop-color="#fff363" />
			<stop offset="0.6" stop-color="#ffe000" />
			<stop offset="1" stop-color="#ffcc00" />
		</linearGradient>
		<mask id="crescent" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
			<circle cx="232" cy="252" r="148" fill="#fff" />
			<circle cx="288" cy="216" r="148" fill="#000" />
		</mask>
		<filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="24" />
		</filter>
	</defs>

	<!-- midnight blue backdrop -->
	<rect width="512" height="512" rx="112" fill="url(#bg)" />
	<rect width="512" height="512" rx="112" fill="url(#ambient)" />

	<!-- outer halo -->
	<g filter="url(#bloom)" opacity="0.9">
		<g mask="url(#crescent)">
			<circle cx="232" cy="252" r="148" fill="#ffd400" />
		</g>
	</g>

	<!-- crescent -->
	<g mask="url(#crescent)">
		<circle cx="232" cy="252" r="148" fill="url(#moon)" />
	</g>

	<!-- subtle edge -->
	<rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
</svg>
